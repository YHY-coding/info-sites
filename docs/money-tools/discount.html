<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>割引・消費税の計算|税込・税抜の変換</title><meta name="description" content="割引後の価格と、税込・税抜の変換を計算します。消費税率は10%と8%(軽減税率)に対応。"><link rel="canonical" href="https://yhy-coding.github.io/info-sites/money-tools/discount.html"><meta property="og:title" content="割引・消費税の計算|税込・税抜の変換"><meta property="og:description" content="割引後の価格と、税込・税抜の変換を計算します。消費税率は10%と8%(軽減税率)に対応。"><meta property="og:type" content="article"><meta property="og:url" content="https://yhy-coding.github.io/info-sites/money-tools/discount.html"><meta property="og:locale" content="ja_JP"><meta name="twitter:card" content="summary">
<style>
:root{--bg:#fff;--fg:#1c2330;--sub:#5b6577;--line:#e3e7ee;--acc:#1d5fd1;--card:#f6f8fb}
@media(prefers-color-scheme:dark){:root{--bg:#10151d;--fg:#e8ecf3;--sub:#9aa5b8;--line:#243044;--acc:#6ea2ff;--card:#171e2a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header,main,footer{max-width:760px;margin:0 auto;padding:0 16px}
header{padding-top:16px;padding-bottom:8px;border-bottom:1px solid var(--line)}
header a.logo{font-weight:700;color:var(--fg);text-decoration:none;font-size:1.1rem}
nav a{margin-right:14px;font-size:.9rem;color:var(--sub);text-decoration:none}
main{padding-top:20px;padding-bottom:32px}h1{font-size:1.5rem;line-height:1.4}h2{font-size:1.2rem;margin-top:2rem;border-left:4px solid var(--acc);padding-left:10px}
a{color:var(--acc)}table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}th{background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.note{font-size:.85rem;color:var(--sub)}input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{background:var(--acc);color:#fff;border:0;cursor:pointer}.big{font-size:1.6rem;font-weight:700}
ul.links{padding-left:1.2rem}footer{border-top:1px solid var(--line);padding-top:14px;padding-bottom:30px;font-size:.82rem;color:var(--sub)}
</style></head><body>
<header><a class="logo" href="index.html">お金の計算ツール集</a><nav><a href="loan/index.html">住宅ローン</a><a href="overtime.html">残業代</a><a href="discount.html">割引・消費税</a></nav></header>
<main><h1>割引・消費税の計算</h1><div class='card'><label>価格(円) <input id='p' type='number' value='1000' min='0' step='1'></label><br><label>消費税率 <select id='t'><option value='10'>10%(標準)</option><option value='8'>8%(軽減税率)</option></select></label><br><label>割引率(%) <input id='d' type='number' value='20' min='0' max='100' step='1'></label><br><br><button id='btn'>計算する</button></div><div id='out' class='card'></div><h2>計算のしかた</h2><ul><li>割引後の価格 = 価格 × (1 − 割引率)</li><li>税込価格 = 税抜価格 × (1 + 税率)(端数は切り捨てで表示)</li><li>税抜価格 = 税込価格 ÷ (1 + 税率)(端数は切り上げで表示)</li></ul><p class='note'>端数の処理(切り捨て・切り上げ・四捨五入)は、店舗や請求書の方針で異なります。</p><script>
function f(x){return Math.round(x).toLocaleString('ja-JP')+'円'}
function run(){var p=parseFloat(document.getElementById('p').value),t=parseFloat(document.getElementById('t').value),d=parseFloat(document.getElementById('d').value)||0;
if(!(p>=0)){document.getElementById('out').textContent='入力を確認してください';return}
var disc=p*(1-d/100),inc=Math.floor(p*(1+t/100)),exc=Math.ceil(p/(1+t/100));
document.getElementById('out').innerHTML='<table><tr><th>'+d+'%引き後の価格</th><td>'+f(disc)+'</td></tr><tr><th>税抜として税込にすると</th><td>'+f(inc)+'</td></tr><tr><th>税込として税抜にすると</th><td>'+f(exc)+'</td></tr></table>'}
document.getElementById('btn').onclick=run;run();
</script></main>
<footer><p>本サイトの計算結果は目安です。実際の金額は、金融機関・勤務先の就業規則・契約内容で変わります。重要な判断の前には、必ず契約書や専門家の説明で確認してください。</p><p>最終更新: 2026-10-08</p></footer></body></html>
